name: Build ShareX Portable (Manual)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable version: latest or v21.0.0, etc.'
        required: true
        default: latest
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout builder files
        uses: actions/checkout@v5
      - name: Verify builder files
        run: python -m unittest discover -s tests -v
      - name: Download and build official ShareX Portable package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/build.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ShareXPortable-Windows-x64
          path: dist/ShareXPortable-*.zip
          if-no-files-found: error
          retention-days: 1
